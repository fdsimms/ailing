# systemd drop-in for caddy.service. Install as
# /etc/systemd/system/caddy.service.d/anki-proxy.conf, then `systemctl daemon-reload`.
#
# An empty token would make the header matcher accept "Bearer ", so Caddy refuses to start
# unless the token is at least 32 characters. ($$ is how systemd writes a literal $.)
[Service]
EnvironmentFile=/etc/caddy/anki-proxy.env
ExecStartPre=/bin/sh -c 'test "$${#ANKI_PROXY_TOKEN}" -ge 32'
